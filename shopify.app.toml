# This file stores configurations for your Shopify app.
# client_id, application_url, and name get filled in automatically the first
# time you run `shopify app config link` against a real app in your Partner
# dashboard — see README.md "First-time setup".

client_id = ""

[access_scopes]
# read_orders only returns orders from the last 60 days. Apply for
# read_all_orders approval early (Partner Dashboard > app > API access,
# it's a review form, not engineering work) then add it here once approved.
# See PLAN.md Section 4, build order step 3.
scopes = "read_orders"

[webhooks]
api_version = "2024-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # --- Core loop: live order sync (PLAN.md Section 4) ---
  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = ["orders/updated"]
  uri = "/webhooks/orders/updated"

  [[webhooks.subscriptions]]
  topics = ["orders/cancelled"]
  uri = "/webhooks/orders/cancelled"

  [[webhooks.subscriptions]]
  topics = ["refunds/create"]
  uri = "/webhooks/refunds/create"

  # --- Mandatory compliance topics — required before any public App Store
  # listing, NOT yet implemented. Needs real logic (export/delete customer
  # data), not a stub. Add as a pre-launch checklist item.
  # See https://shopify.dev/docs/apps/build/privacy-law-compliance
  # [[webhooks.subscriptions]]
