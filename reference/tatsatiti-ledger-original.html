<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tatsatiti Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --ink:#13322E;
    --ink-2:#1E463F;
    --paper:#F2F0E6;
    --card:#FFFFFF;
    --border:#DEDCC9;
    --border-soft:#E9E7DA;
    --accent:#A9781F;
    --accent-soft:#F1E4C4;
    --positive:#3C7A5D;
    --positive-soft:#E1EEE5;
    --negative:#B23A2E;
    --negative-soft:#F6E2DF;
    --text:#1B2420;
    --text-muted:#6B7268;
    --text-faint:#9BA098;
    --radius:10px;
    --shadow: 0 1px 2px rgba(19,50,46,0.06), 0 4px 16px rgba(19,50,46,0.05);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--text);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:236px; flex-shrink:0;
    background:var(--ink);
    color:#EDEFE7;
    padding:22px 14px 18px;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{
    font-family:var(--font-display);
    font-size:20px; font-weight:600; letter-spacing:0.01em;
    color:#fff; padding:2px 10px 4px;
  }
  .brand small{
    display:block; font-family:var(--font-mono); font-size:10px;
    color:#9FB6AC; font-weight:400; letter-spacing:0.06em; margin-top:3px;
    text-transform:uppercase;
  }
  .nav-group{ margin-top:22px; }
  .nav-label{
    font-family:var(--font-mono); font-size:10px; letter-spacing:0.12em;
    color:#7C9389; text-transform:uppercase; padding:0 10px; margin-bottom:6px;
  }
  .nav-btn{
    display:flex; align-items:center; gap:10px;
    width:100%; text-align:left; background:none; border:none;
    color:#CFDAD3; font-family:var(--font-body); font-size:13.5px; font-weight:500;
    padding:9px 10px; border-radius:7px; cursor:pointer;
    margin-bottom:2px; transition:background .12s ease, color .12s ease;
  }
  .nav-btn:hover{ background:rgba(255,255,255,0.06); color:#fff; }
  .nav-btn.active{ background:#EDEFE7; color:var(--ink); font-weight:600; }
  .nav-btn .ic{ width:16px; text-align:center; opacity:0.9; font-size:14px; }
  .sidebar-foot{
    margin-top:auto; padding:12px 10px 2px; font-family:var(--font-mono);
    font-size:10px; color:#6E8579; border-top:1px solid rgba(255,255,255,0.08); padding-top:14px;
  }

  /* ---------- Main ---------- */
  .main{ flex:1; min-width:0; padding:26px 34px 60px; }
  .topbar{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:22px; flex-wrap:wrap; gap:14px;
  }
  .page-title{
    font-family:var(--font-display); font-size:28px; font-weight:600; color:var(--ink);
    margin:0;
  }
  .page-sub{ color:var(--text-muted); font-size:13px; margin-top:4px; }
  .range-bar{
    display:flex; align-items:center; gap:8px; background:var(--card);
    border:1px solid var(--border); border-radius:9px; padding:5px;
    box-shadow:var(--shadow);
  }
  .range-bar select, .range-bar input[type=date]{
    border:none; background:transparent; font-family:var(--font-body);
    font-size:12.5px; color:var(--text); padding:5px 6px; outline:none;
  }
  .pill-btn{
    font-family:var(--font-body); font-size:12px; font-weight:600;
    background:var(--ink); color:#fff; border:none; border-radius:7px;
    padding:7px 13px; cursor:pointer;
  }
  .pill-btn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--border); }
  .pill-btn:hover{ opacity:0.88; }
  .pill-btn.small{ padding:5px 10px; font-size:11.5px; }

  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  /* ---------- Cards / grid ---------- */
  .kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:22px; }
  .kpi-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 17px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .kpi-card .lbl{ font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.07em; color:var(--text-muted); }
  .kpi-card .val{ font-family:var(--font-display); font-size:26px; font-weight:600; color:var(--ink); margin-top:6px; }
  .kpi-card .sub{ font-size:11.5px; color:var(--text-muted); margin-top:4px; }
  .kpi-card .sub.pos{ color:var(--positive); }
  .kpi-card .sub.neg{ color:var(--negative); }
  .kpi-card .seal{
    position:absolute; top:12px; right:12px; width:26px; height:26px; border-radius:50%;
    border:1.5px solid var(--accent); display:flex; align-items:center; justify-content:center;
    color:var(--accent); font-size:12px;
  }

  .panel-row{ display:grid; gap:16px; }
  .panel-row.two{ grid-template-columns:1.4fr 1fr; }
  .panel-row.three{ grid-template-columns:repeat(3,1fr); }
  @media (max-width:980px){ .panel-row.two, .panel-row.three{ grid-template-columns:1fr; } }

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; box-shadow:var(--shadow); margin-bottom:16px;
  }
  .card-h{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  .card-h h3{ font-family:var(--font-display); font-size:16px; font-weight:600; margin:0; color:var(--ink); }
  .card-h .note{ font-size:11.5px; color:var(--text-muted); }
  .chart-wrap{ position:relative; height:260px; }
  .chart-wrap.short{ height:190px; }

  table{ width:100%; border-collapse:collapse; font-size:12.8px; }
  thead th{
    text-align:left; font-family:var(--font-mono); font-size:10px; text-transform:uppercase;
    letter-spacing:0.05em; color:var(--text-muted); font-weight:600; padding:7px 8px;
    border-bottom:1px solid var(--border); white-space:nowrap;
  }
  tbody td{ padding:8px 8px; border-bottom:1px solid var(--border-soft); vertical-align:top; }
  tbody tr:hover{ background:#FAF9F3; }
  .num{ font-family:var(--font-mono); text-align:right; white-space:nowrap; }
  .mono{ font-family:var(--font-mono); }
  .muted{ color:var(--text-muted); }
  .table-scroll{ overflow-x:auto; }

  .tag{
    display:inline-block; font-family:var(--font-mono); font-size:10px; padding:2px 7px;
    border-radius:20px; text-transform:uppercase; letter-spacing:0.03em; font-weight:600;
  }
  .tag.paid{ background:var(--positive-soft); color:var(--positive); }
  .tag.due{ background:var(--negative-soft); color:var(--negative); }
  .tag.neutral{ background:var(--accent-soft); color:var(--accent); }
  .tag.grey{ background:#EEEDE3; color:var(--text-muted); }

  .empty-state{
    text-align:center; padding:40px 20px; color:var(--text-muted);
  }
  .empty-state .big{ font-family:var(--font-display); font-size:18px; color:var(--ink); margin-bottom:6px;}

  textarea{
    width:100%; font-family:var(--font-mono); font-size:11.5px; border:1px solid var(--border);
    border-radius:8px; padding:10px; resize:vertical; background:#FCFBF6; color:var(--text);
  }
  input[type=text], input[type=number], input[type=date], select{
    font-family:var(--font-body); font-size:13px; border:1px solid var(--border);
    border-radius:7px; padding:7px 9px; background:#fff; color:var(--text); width:100%;
  }
  label{ font-size:11.5px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:4px; }
  .field{ margin-bottom:12px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .toast{
    position:fixed; bottom:20px; right:20px; background:var(--ink); color:#fff;
    padding:11px 16px; border-radius:8px; font-size:12.5px; box-shadow:var(--shadow);
    opacity:0; transform:translateY(6px); transition:all .2s ease; pointer-events:none; z-index:999;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  .badge-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .stat-line{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border-soft); font-size:12.8px; }
  .stat-line:last-child{ border-bottom:none; }
  .stat-line .k{ color:var(--text-muted); }
  .stat-line .v{ font-family:var(--font-mono); font-weight:600; color:var(--ink); }

  .ledger-strip{
    display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:10.5px;
    color:var(--text-muted); margin-bottom:16px; padding-bottom:10px; border-bottom:1px dashed var(--border);
  }
  .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); }

  .cth-timeline{ display:flex; flex-direction:column; gap:0; }
  .cth-item{ display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--border-soft); }
  .cth-item:last-child{ border-bottom:none; }
  .cth-dot{ width:30px; height:30px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px; font-weight:700; flex-shrink:0; }
  .cth-item.urgent .cth-dot{ background:var(--negative-soft); color:var(--negative); }
  .cth-body .t{ font-weight:600; color:var(--ink); font-size:13.5px; }
  .cth-body .d{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .cth-date{ margin-left:auto; text-align:right; font-family:var(--font-mono); font-size:12.5px; color:var(--ink); font-weight:600; white-space:nowrap; }

  .import-drop{
    border:1.5px dashed var(--border); border-radius:10px; padding:20px; text-align:center;
    color:var(--text-muted); font-size:12.5px; background:#FCFBF6; margin-bottom:12px;
  }
  .flex-between{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .disclaimer{
    font-size:11px; color:var(--text-faint); background:#FAF9F3; border:1px solid var(--border-soft);
    border-radius:8px; padding:10px 12px; margin-top:10px; line-height:1.5;
  }
  .search-box{
    display:flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:7px;
    padding:5px 10px; background:#fff; min-width:180px;
  }
  .search-box input{ border:none; outline:none; font-size:12.5px; width:100%; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:#D6D3C2; border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
</style>
</head>

<script id="app-script">
/* ============================================================
   TATSATITI LEDGER — core utilities, storage, parsers
   ============================================================ */

const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function fmtGBP(n, opts){
  opts = opts || {};
  if (n === null || n === undefined || isNaN(n)) n = 0;
  const neg = n < 0;
  const abs = Math.abs(n);
  const s = abs.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (neg ? '\u2212' : '') + '\u00A3' + s;
}
function fmtNum(n){
  if (n === null || n === undefined || isNaN(n)) n = 0;
  return n.toLocaleString('en-GB');
}
function fmtPct(n){
  if (n === null || n === undefined || isNaN(n)) return '\u2014';
  return n.toFixed(1) + '%';
}
function escapeHtml(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function uid(prefix){ return (prefix||'id') + '_' + Math.random().toString(36).slice(2,10); }

// Parse a wide variety of date strings into a JS Date (UTC-agnostic, local).
function parseDateLoose(s){
  if (!s) return null;
  s = String(s).trim();
  // Shopify style: 2026-07-23 13:09:30 +0100
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
  // "21 July 2026"
  m = s.match(/^(\d{1,2})\s+(\w+)\s+(\d{4})$/);
  if (m) {
    const mi = MONTHS_LONG.findIndex(mo => mo.toLowerCase().startsWith(m[2].toLowerCase().slice(0,3)));
    if (mi >= 0) return new Date(parseInt(m[3]), mi, parseInt(m[1]));
  }
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function monthKey(d){
  if (!d) return 'unknown';
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(key){
  if (key === 'unknown') return 'Undated';
  const [y,m] = key.split('-');
  return MONTHS_LONG[parseInt(m)-1].slice(0,3) + ' ' + y;
}
function fmtDateShort(d){
  if (!d) return '\u2014';
  return d.getDate() + ' ' + MONTHS_LONG[d.getMonth()].slice(0,3) + ' ' + d.getFullYear();
}
function addMonths(date, n){
  const d = new Date(date.getTime());
  d.setMonth(d.getMonth() + n);
  return d;
}
function lastDayOfMonth(date){
  return new Date(date.getFullYear(), date.getMonth()+1, 0);
}
function addDays(date, n){
  const d = new Date(date.getTime());
  d.setDate(d.getDate() + n);
  return d;
}

/* ---------------- Storage layer ----------------
   Uses window.storage (personal, per-user, persists across sessions)
   with an in-memory fallback if storage is unavailable. */
const MEM_FALLBACK = {};
let STORAGE_OK = true;

async function storeGet(key){
  try{
    if (window.storage && window.storage.get){
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }
  }catch(e){ /* key not found or storage unavailable */ }
  return MEM_FALLBACK[key] !== undefined ? MEM_FALLBACK[key] : null;
}
async function storeSet(key, value){
  MEM_FALLBACK[key] = value;
  try{
    if (window.storage && window.storage.set){
      await window.storage.set(key, JSON.stringify(value), false);
      return true;
    }
  }catch(e){ STORAGE_OK = false; }
  return false;
}

/* ---------------- Shopify orders CSV parser ---------------- */
function num(v){
  if (v === undefined || v === null) return null;
  const s = String(v).trim();
  if (s === '') return null;
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function str(v){
  if (v === undefined || v === null) return null;
  const s = String(v).trim();
  return s === '' ? null : s;
}
function parseShopifyOrdersCSV(csvText){
  if (typeof Papa === 'undefined'){
    throw new Error('CSV parser library did not load on this network. Try reloading, or a different network/connection.');
  }
  const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
  const rows = parsed.data;
  const orders = {};
  const order = [];
  for (const row of rows){
    const name = str(row['Name']);
    if (!name) continue;
    if (!orders[name]){
      order.push(name);
      orders[name] = {
        id: name,
        email: str(row['Email']),
        financialStatus: str(row['Financial Status']),
        paidAt: str(row['Paid at']),
        fulfillmentStatus: str(row['Fulfillment Status']),
        currency: str(row['Currency']) || 'GBP',
        subtotal: num(row['Subtotal']) || 0,
        shipping: num(row['Shipping']) || 0,
        taxes: num(row['Taxes']) || 0,
        total: num(row['Total']) || 0,
        discountCode: str(row['Discount Code']),
        discountAmount: num(row['Discount Amount']) || 0,
        createdAt: str(row['Created at']),
        billingName: str(row['Billing Name']),
        billingCity: str(row['Billing City']),
        billingZip: str(row['Billing Zip']),
        billingProvince: str(row['Billing Province']),
        billingCountry: str(row['Billing Country']),
        shippingName: str(row['Shipping Name']),
        shippingCity: str(row['Shipping City']),
        shippingZip: str(row['Shipping Zip']),
        shippingProvince: str(row['Shipping Province']),
        shippingCountry: str(row['Shipping Country']),
        cancelledAt: str(row['Cancelled at']),
        paymentMethod: str(row['Payment Method']),
        refundedAmount: num(row['Refunded Amount']) || 0,
        vendor: str(row['Vendor']),
        outstandingBalance: num(row['Outstanding Balance']) || 0,
        tags: str(row['Tags']),
        source: str(row['Source']),
        lineItems: [],
      };
    }
    if (str(row['Lineitem name'])){
      orders[name].lineItems.push({
        qty: num(row['Lineitem quantity']) || 0,
        name: str(row['Lineitem name']),
        price: num(row['Lineitem price']) || 0,
        sku: str(row['Lineitem sku']),
        fulfillmentStatus: str(row['Lineitem fulfillment status']),
        vendor: str(row['Vendor']),
      });
    }
  }
  return order.map(n => orders[n]);
}

/* ---------------- AW Dropship supplier invoice text parser ----------------
   Paste raw text extracted from a supplier invoice PDF and this will
   extract one or more invoices/refunds with line items. */
function parseSupplierInvoiceText(text){
  const chunks = text.split(/\n(?=Invoice inv-|Refund ref-)/g);
  const docs = [];
  for (const raw of chunks){
    const c = raw.trim();
    if (/^Invoice inv-/.test(c) || /^Refund ref-/.test(c)) docs.push(raw);
  }
  const results = [];
  for (const d of docs){
    const isRefund = /^\s*Refund ref-/.test(d);
    let docNumber = null, docDate = null, originalInvoice = null;
    if (isRefund){
      const m = d.match(/Refund (ref-[\w-]+) Refund Date:\s*(\d{1,2} \w+ \d{4})/);
      if (m){ docNumber = m[1]; docDate = m[2]; }
      const om = d.match(/Original invoice number:\s*(inv-[\w-]+)/);
      if (om) originalInvoice = om[1];
    } else {
      const m = d.match(/Invoice (inv-[\w-]+) Invoice date:\s*(\d{1,2} \w+ \d{4})/);
      if (m){ docNumber = m[1]; docDate = m[2]; }
    }
    if (!docNumber) continue; // skip unparseable chunk
    const paymentStateM = d.match(/Payment State:\s*(\w+)/);
    const weightM = d.match(/Weight:\s*([\d.]+ ?k?g)/);
    const dm = d.match(/Delivery address:([\s\S]*?)Code Description Price Qty\.? Amount/);
    let deliveryCountry = null;
    if (dm){
      const lines = dm[1].split('\n').map(l=>l.trim()).filter(Boolean);
      deliveryCountry = lines.length ? lines[lines.length-1] : null;
    }
    const netM = d.match(/Total Net\s*\u00A3(-?[\d.]+)/);
    const totalM = d.match(/\nTotal\s*\u00A3(-?[\d.]+)/);
    const vatM = d.match(/Tax\s*\u00A3(-?[\d.]+)\s*\nVAT 20% \(rate:20%\)/);
    const outsideScope = /Outside the scope of Tax/.test(d);
    const shippingM = d.match(/\nShipping\s*\u00A3(-?[\d.]+)/);
    const chargesM = d.match(/\nCharges\s*\u00A3(-?[\d.]+)/);

    const items = [];
    const itemRe = /^([A-Za-z0-9\-]+)\s+(.+?)\s+\u00A3(-?[\d.]+)\s+(-?\d+)\s+\u00A3(-?[\d.]+)\s*$/gm;
    let im;
    while ((im = itemRe.exec(d)) !== null){
      const code = im[1], desc = im[2], price = im[3], qty = im[4], amount = im[5];
      if (['Total','Tax','VAT'].indexOf(code) !== -1) continue;
      items.push({ code, desc: desc.trim(), price: parseFloat(price), qty: parseInt(qty,10), amount: parseFloat(amount) });
    }

    results.push({
      docNumber, type: isRefund ? 'refund' : 'invoice', date: docDate, originalInvoice,
      paymentState: paymentStateM ? paymentStateM[1] : null,
      weight: weightM ? weightM[1] : null,
      deliveryCountry,
      totalNet: netM ? parseFloat(netM[1]) : null,
      shipping: shippingM ? parseFloat(shippingM[1]) : null,
      charges: chargesM ? parseFloat(chargesM[1]) : null,
      vat: vatM ? parseFloat(vatM[1]) : (outsideScope ? 0 : null),
      total: totalM ? parseFloat(totalM[1]) : null,
      outsideScopeOfTax: outsideScope,
      lineItems: items,
    });
  }
  return results;
}

/* Codes on supplier invoices that represent shipping/handling, not real products */
function isFulfillmentCode(code){
  if (!code) return false;
  return /^Z\d+$/i.test(code) || code === 'Hanging-AWD';
}

/* ---------------- File reading helpers ---------------- */
function readFileAsText(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsText(file);
  });
}
function readFileAsArrayBuffer(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

/* Reconstruct reading-order text from a pdf.js page's text content,
   clustering items into lines by y-position and ordering left-to-right
   within each line (mirrors how server-side PDF text extractors read tables). */
function pdfPageToText(items){
  const pts = items.map(it => ({ x: it.transform[4], y: it.transform[5], str: it.str }))
    .filter(p => p.str !== undefined);
  pts.sort((a,b) => b.y - a.y || a.x - b.x);
  const TOL = 2.5;
  const lines = [];
  let current = null;
  pts.forEach(p => {
    if (current && Math.abs(p.y - current.y) <= TOL){
      current.items.push(p);
    } else {
      current = { y: p.y, items: [p] };
      lines.push(current);
    }
  });
  return lines.map(l => l.items.sort((a,b) => a.x-b.x).map(i => i.str).join(' ')).join('\n');
}

async function extractPdfText(file){
  if (typeof pdfjsLib === 'undefined'){
    throw new Error('PDF reader library did not load on this network. Try reloading, or use the paste-text option.');
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = (typeof PDFJS_WORKER_SRC !== 'undefined' && PDFJS_WORKER_SRC)
    ? PDFJS_WORKER_SRC
    : 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await readFileAsArrayBuffer(file);
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pageTexts = [];
  for (let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    pageTexts.push(pdfPageToText(content.items));
  }
  return pageTexts.join('\n');
}

function getOrderDate(o){ return parseDateLoose(o.paidAt || o.createdAt); }
function getInvoiceDate(inv){ return parseDateLoose(inv.date); }

function inRange(date, range){
  if (range.preset === 'all') return true;
  if (!date) return false;
  if (range.from && date < range.from) return false;
  if (range.to && date > range.to) return false;
  return true;
}

function resolveRange(rangeState){
  const now = new Date();
  if (rangeState.preset === 'month'){
    return { preset:'month', from:new Date(now.getFullYear(),now.getMonth(),1), to:lastDayOfMonth(now) };
  }
  if (rangeState.preset === 'quarter'){
    return { preset:'quarter', from:addDays(now,-90), to:now };
  }
  if (rangeState.preset === 'fy'){
    const apr6ThisYear = new Date(now.getFullYear(),3,6);
    let from, to;
    if (now >= apr6ThisYear){ from = apr6ThisYear; to = new Date(now.getFullYear()+1,3,5); }
    else { from = new Date(now.getFullYear()-1,3,6); to = new Date(now.getFullYear(),3,5); }
    return { preset:'fy', from, to };
  }
  if (rangeState.preset === 'custom'){
    return { preset:'custom', from: rangeState.from ? new Date(rangeState.from) : null, to: rangeState.to ? new Date(rangeState.to) : null };
  }
  return { preset:'all', from:null, to:null };
}

function filterOrders(orders, range){
  return orders.filter(o => inRange(getOrderDate(o), range));
}
function filterInvoices(invoices, range){
  return invoices.filter(i => inRange(getInvoiceDate(i), range));
}
function activeOrders(orders){ return orders.filter(o => !o.cancelledAt); }

function computeKPIs(orders, invoices, range){
  const ords = filterOrders(activeOrders(orders), range);
  const invs = filterInvoices(invoices, range);
  const revenue = ords.reduce((s,o)=> s + (o.total||0) - (o.refundedAmount||0), 0);
  const ordersCount = ords.length;
  const aov = ordersCount ? revenue/ordersCount : 0;
  const cogs = invs.reduce((s,i)=> s + (i.total||0), 0);
  const grossProfit = revenue - cogs;
  const margin = revenue ? (grossProfit/revenue*100) : null;
  const inputVAT = invs.reduce((s,i)=> s + (i.vat||0), 0);
  const uniqueCustomers = new Set(ords.map(o => (o.email||o.billingName||'').toLowerCase())).size;
  const refunds = invs.filter(i=>i.type==='refund').reduce((s,i)=> s + Math.abs(i.total||0), 0);
  return { revenue, ordersCount, aov, cogs, grossProfit, margin, inputVAT, uniqueCustomers, invoiceCount: invs.length, refunds };
}

function monthlySeries(orders, invoices){
  const map = {};
  activeOrders(orders).forEach(o => {
    const k = monthKey(getOrderDate(o));
    map[k] = map[k] || { revenue:0, cogs:0, orders:0 };
    map[k].revenue += (o.total||0) - (o.refundedAmount||0);
    map[k].orders += 1;
  });
  invoices.forEach(inv => {
    const k = monthKey(getInvoiceDate(inv));
    map[k] = map[k] || { revenue:0, cogs:0, orders:0 };
    map[k].cogs += inv.total||0;
  });
  const keys = Object.keys(map).filter(k => k !== 'unknown').sort();
  return keys.map(k => ({ key:k, label:monthLabel(k), revenue:map[k].revenue, cogs:map[k].cogs, orders:map[k].orders, profit: map[k].revenue - map[k].cogs }));
}

function computeVATReturn(orders, invoices, range){
  const ords = filterOrders(activeOrders(orders), range);
  const invs = filterInvoices(invoices, range);
  const outputVAT = ords.reduce((s,o)=> s + (o.taxes||0), 0);
  const inputVAT = invs.reduce((s,i)=> s + (i.vat||0), 0);
  const netVATdue = outputVAT - inputVAT;
  const box6 = ords.reduce((s,o)=> s + (o.subtotal||0) + (o.shipping||0), 0);
  const box7 = invs.reduce((s,i)=> s + (i.totalNet||0), 0);
  return { outputVAT, inputVAT, netVATdue, box6, box7, orderCount: ords.length, invoiceCount: invs.length };
}

function computePL(orders, invoices, range){
  const ords = filterOrders(activeOrders(orders), range);
  const invs = filterInvoices(invoices, range);
  const revenue = ords.reduce((s,o)=> s + (o.total||0) - (o.refundedAmount||0), 0);
  const cogs = invs.reduce((s,i)=> s + (i.total||0), 0);
  const grossProfit = revenue - cogs;
  const marginPct = revenue ? (grossProfit/revenue*100) : null;

  const monthMap = {};
  ords.forEach(o => {
    const k = monthKey(getOrderDate(o));
    monthMap[k] = monthMap[k] || { revenue:0, cogs:0 };
    monthMap[k].revenue += (o.total||0) - (o.refundedAmount||0);
  });
  invs.forEach(i => {
    const k = monthKey(getInvoiceDate(i));
    monthMap[k] = monthMap[k] || { revenue:0, cogs:0 };
    monthMap[k].cogs += i.total||0;
  });
  const rows = Object.keys(monthMap).filter(k => k !== 'unknown').sort().map(k => ({
    key:k, label:monthLabel(k), revenue:monthMap[k].revenue, cogs:monthMap[k].cogs, profit: monthMap[k].revenue - monthMap[k].cogs
  }));
  return { revenue, cogs, grossProfit, marginPct, rows, orderCount: ords.length, invoiceCount: invs.length };
}

function computeCustomerIntel(orders, range){
  const ords = filterOrders(activeOrders(orders), range);
  const byCustomer = {};
  ords.forEach(o => {
    const key = (o.email || o.billingName || 'unknown').toLowerCase();
    if (!byCustomer[key]){
      byCustomer[key] = {
        name: o.billingName || o.shippingName || key, email: o.email, orders: 0, revenue: 0,
        lastOrder: null, firstOrder: null,
        region: o.shippingProvince || o.billingProvince, country: o.shippingCountry || o.billingCountry
      };
    }
    byCustomer[key].orders += 1;
    byCustomer[key].revenue += (o.total||0) - (o.refundedAmount||0);
    const d = getOrderDate(o);
    if (d && (!byCustomer[key].lastOrder || d > byCustomer[key].lastOrder)) byCustomer[key].lastOrder = d;
    if (d && (!byCustomer[key].firstOrder || d < byCustomer[key].firstOrder)) byCustomer[key].firstOrder = d;
  });
  const list = Object.values(byCustomer).sort((a,b) => b.revenue - a.revenue);
  const repeatCustomers = list.filter(c => c.orders > 1).length;
  const oneTime = list.length - repeatCustomers;

  const byRegion = {};
  ords.forEach(o => {
    const region = o.shippingCountry === 'GB' ? (o.shippingProvince || 'Unknown UK region') : (o.shippingCountry || 'Unknown');
    byRegion[region] = byRegion[region] || { revenue:0, orders:0 };
    byRegion[region].revenue += (o.total||0) - (o.refundedAmount||0);
    byRegion[region].orders += 1;
  });
  const regionList = Object.entries(byRegion).map(([k,v]) => ({ region:k, revenue:v.revenue, orders:v.orders })).sort((a,b) => b.revenue - a.revenue);

  return { list, repeatCustomers, oneTime, regionList, totalCustomers: list.length };
}

function buildCostMap(invoices){
  const map = {};
  invoices.filter(i => i.type === 'invoice').forEach(inv => {
    const d = getInvoiceDate(inv);
    (inv.lineItems||[]).forEach(li => {
      if (isFulfillmentCode(li.code)) return;
      const key = (li.code||'').toLowerCase();
      if (!key) return;
      if (!map[key] || (d && (!map[key].date || d > map[key].date))){
        map[key] = { cost: li.price, date: d, desc: li.desc };
      }
    });
  });
  return map;
}

function computeProductIntel(orders, invoices, range){
  const ords = filterOrders(activeOrders(orders), range);
  const costMap = buildCostMap(invoices);
  const byProduct = {};
  ords.forEach(o => {
    (o.lineItems||[]).forEach(li => {
      const key = (li.sku || li.name || 'unknown').toLowerCase();
      if (!byProduct[key]) byProduct[key] = { name: li.name, sku: li.sku, qty:0, revenue:0, cost:0, hasCost:false };
      byProduct[key].qty += li.qty||0;
      byProduct[key].revenue += (li.price||0) * (li.qty||0);
      const costEntry = li.sku ? costMap[li.sku.toLowerCase()] : null;
      if (costEntry){ byProduct[key].cost += costEntry.cost * (li.qty||0); byProduct[key].hasCost = true; }
    });
  });
  const list = Object.values(byProduct).map(p => ({
    ...p,
    margin: p.hasCost ? (p.revenue - p.cost) : null,
    marginPct: (p.hasCost && p.revenue) ? ((p.revenue - p.cost)/p.revenue*100) : null
  }));
  list.sort((a,b) => b.revenue - a.revenue);
  return list;
}

function computeCompaniesHouseDates(company){
  const inc = parseDateLoose(company.incorporationDate);
  if (!inc) return null;
  const firstAnniversary = new Date(inc.getFullYear()+1, inc.getMonth(), inc.getDate());
  const accountingReferenceDate = lastDayOfMonth(firstAnniversary);
  const firstAccountsDue = addMonths(inc, 21);
  const confirmationReviewDate = firstAnniversary;
  const confirmationDue = addDays(confirmationReviewDate, 14);
  const ctPeriodEnd = accountingReferenceDate;
  const ctReturnDue = addMonths(ctPeriodEnd, 12);
  const ctPaymentDue = addDays(addMonths(ctPeriodEnd, 9), 1);
  const ctNotifyDue = addMonths(inc, 3);
  return {
    incorporationDate: inc, accountingReferenceDate, firstAccountsDue,
    confirmationReviewDate, confirmationDue, ctPeriodEnd, ctReturnDue, ctPaymentDue, ctNotifyDue
  };
}

function mergeOrders(existing, incoming){
  const map = {};
  existing.forEach(o => map[o.id] = o);
  let added = 0, updated = 0;
  incoming.forEach(o => { if (map[o.id]) updated++; else added++; map[o.id] = o; });
  return { list: Object.values(map), added, updated };
}
function mergeInvoices(existing, incoming){
  const map = {};
  existing.forEach(i => map[i.docNumber] = i);
  let added = 0, updated = 0;
  incoming.forEach(i => { if (map[i.docNumber]) updated++; else added++; map[i.docNumber] = i; });
  return { list: Object.values(map), added, updated };
}

const VAT_THRESHOLD = 90000;

function rollingTurnover12mo(orders){
  const now = new Date();
  const cutoff = addMonths(now, -12);
  return activeOrders(orders).reduce((s,o) => {
    const d = getOrderDate(o);
    if (d && d >= cutoff && d <= now) return s + (o.total||0) - (o.refundedAmount||0);
    return s;
  }, 0);
}

function renderDashboard(){
  const range = currentRange();
  const kpi = computeKPIs(STATE.orders, STATE.invoices, range);
  const series = monthlySeries(STATE.orders, STATE.invoices).slice(-12);
  const turnover12 = rollingTurnover12mo(STATE.orders);
  const pctToThreshold = Math.min(100, (turnover12 / VAT_THRESHOLD) * 100);
  const ch = computeCompaniesHouseDates(STATE.company);

  const recentOrders = [...activeOrders(STATE.orders)]
    .sort((a,b) => (getOrderDate(b)||0) - (getOrderDate(a)||0)).slice(0,6);
  const recentInvoices = [...STATE.invoices]
    .sort((a,b) => (getInvoiceDate(b)||0) - (getInvoiceDate(a)||0)).slice(0,6);

  let upcoming = [];
  if (ch){
    upcoming = [
      { label:'Confirmation statement due', date: ch.confirmationDue },
      { label:'Annual accounts due', date: ch.firstAccountsDue },
      { label:'Corporation Tax return due', date: ch.ctReturnDue },
      { label:'Corporation Tax payment due', date: ch.ctPaymentDue },
    ].filter(x => x.date && x.date > new Date()).sort((a,b) => a.date - b.date).slice(0,2);
  }

  const el = document.getElementById('tab-dashboard');
  el.innerHTML = `
    <div class="ledger-strip"><span class="dot"></span> ${escapeHtml(STATE.company.name)} &middot; Company No. ${escapeHtml(STATE.company.number)} &middot; ${kpi.invoiceCount + kpi.ordersCount ? 'live ledger' : 'no data yet'}</div>

      <div class="kpi-card">
        <div class="lbl">Revenue</div>
        <div class="val">${fmtGBP(kpi.revenue)}</div>
        <div class="sub">${fmtNum(kpi.ordersCount)} orders &middot; AOV ${fmtGBP(kpi.aov)}</div>
      </div>
      <div class="kpi-card">
        <div class="lbl">Cost of goods</div>
        <div class="val">${fmtGBP(kpi.cogs)}</div>
        <div class="sub">${fmtNum(kpi.invoiceCount)} supplier invoices</div>

        <div class="val">${fmtGBP(kpi.grossProfit)}</div>
        <div class="sub ${kpi.margin!==null && kpi.margin>=0 ? 'pos':'neg'}">${kpi.margin!==null ? fmtPct(kpi.margin)+' margin' : '\u2014'}</div>

function expensesInRange(range){
  return STATE.expenses.filter(e => inRange(parseDateLoose(e.date), range));
}

function renderPL(){
  const range = currentRange();
  const pl = computePL(STATE.orders, STATE.invoices, range);
  const exps = expensesInRange(range);
  const totalExpenses = exps.reduce((s,e) => s + (e.amount||0), 0);
  const netProfit = pl.grossProfit - totalExpenses;
  const netMarginPct = pl.revenue ? (netProfit/pl.revenue*100) : null;

  const el = document.getElementById('tab-pl');
  el.innerHTML = `
    <div class="panel-row three">
      <div class="kpi-card"><div class="lbl">Revenue</div><div class="val">${fmtGBP(pl.revenue)}</div><div class="sub">${pl.orderCount} orders</div></div>
      <div class="kpi-card"><div class="lbl">Cost of goods sold</div><div class="val">${fmtGBP(pl.cogs)}</div><div class="sub">${pl.invoiceCount} supplier invoices</div></div>
      <div class="kpi-card"><div class="lbl">Gross profit</div><div class="val">${fmtGBP(pl.grossProfit)}</div><div class="sub ${pl.marginPct>=0?'pos':'neg'}">${pl.marginPct!==null?fmtPct(pl.marginPct):'\u2014'} gross margin</div></div>
    </div>

    <div class="card">
      <div class="card-h">
        <h3>Monthly income statement</h3>
        <div class="note">Revenue &minus; COGS = Gross profit, by month</div>
      </div>
      <div class="chart-wrap"><canvas id="chartPL"></canvas></div>
    </div>

    <div class="panel-row two">
      <div class="card">
        <div class="card-h"><h3>Monthly breakdown</h3></div>
        <div class="table-scroll"><table>
          <thead><tr><th>Month</th><th class="num">Revenue</th><th class="num">COGS</th><th class="num">Gross profit</th><th class="num">Margin</th></tr></thead>
          <tbody>
          ${pl.rows.length ? pl.rows.map(r => `
            <tr>
              <td>${r.label}</td>
              <td class="num">${fmtGBP(r.revenue)}</td>
              <td class="num">${fmtGBP(r.cogs)}</td>
              <td class="num">${fmtGBP(r.profit)}</td>
              <td class="num">${r.revenue ? fmtPct(r.profit/r.revenue*100) : '\u2014'}</td>
            </tr>`).join('') : '<tr><td colspan="5" class="muted">No data in this range.</td></tr>'}
          </tbody>
          <tfoot>
            <tr style="font-weight:700; border-top:2px solid var(--border);">
              <td>Total</td>
              <td class="num">${fmtGBP(pl.revenue)}</td>
              <td class="num">${fmtGBP(pl.cogs)}</td>
              <td class="num">${fmtGBP(pl.grossProfit)}</td>
              <td class="num">${pl.marginPct!==null?fmtPct(pl.marginPct):'\u2014'}</td>
            </tr>
          </tfoot>
        </table></div>
      </div>

      <div class="card">
        <div class="card-h"><h3>Operating expenses</h3><div class="note">optional, to reach net profit</div></div>
        <form id="expenseForm">
          <div class="field-row">
            <div class="field"><label>Date</label><input type="date" id="expDate" required></div>
            <div class="field"><label>Amount (£)</label><input type="number" id="expAmount" step="0.01" min="0" required></div>
          </div>
          <div class="field"><label>Category</label>
            <select id="expCategory">
              <option>Software &amp; subscriptions</option>
              <option>Advertising &amp; marketing</option>
              <option>Bank &amp; payment fees</option>
              <option>Postage &amp; packaging</option>
              <option>Professional fees</option>
              <option>Office &amp; admin</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field"><label>Description</label><input type="text" id="expDesc" placeholder="e.g. Shopify subscription"></div>
          <button type="submit" class="pill-btn" style="width:100%;">Add expense</button>
        </form>
        <div class="table-scroll" style="margin-top:14px;"><table>
          <thead><tr><th>Date</th><th>Category</th><th class="num">Amount</th><th></th></tr></thead>
          <tbody>
          ${exps.length ? exps.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(e => `
            <tr>
              <td class="muted">${fmtDateShort(parseDateLoose(e.date))}</td>
              <td>${escapeHtml(e.category)}${e.description ? '<div class="muted" style="font-size:10.5px;">'+escapeHtml(e.description)+'</div>' : ''}</td>
              <td class="num">${fmtGBP(e.amount)}</td>
              <td><button class="pill-btn ghost small" data-del-exp="${e.id}">Remove</button></td>
            </tr>`).join('') : '<tr><td colspan="4" class="muted">No expenses logged in this range.</td></tr>'}
          </tbody>
        </table></div>
        <div class="stat-line" style="margin-top:8px;"><span class="k">Total operating expenses</span><span class="v">${fmtGBP(totalExpenses)}</span></div>
        <div class="stat-line"><span class="k">Net profit</span><span class="v" style="color:${netProfit>=0?'var(--positive)':'var(--negative)'}">${fmtGBP(netProfit)}</span></div>

        <div class="disclaimer">This is a management P&amp;L built from your sales and supplier data plus whatever expenses you log here \u2014 it isn't a substitute for statutory accounts prepared under UK GAAP/FRS 105 for Companies House and HMRC filings.</div>
      </div>
    </div>
  `;

  document.getElementById('expenseForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const date = document.getElementById('expDate').value;
    const amount = parseFloat(document.getElementById('expAmount').value);
    const category = document.getElementById('expCategory').value;
    const description = document.getElementById('expDesc').value;
    if (!date || isNaN(amount)) return;
    STATE.expenses.push({ id: uid('exp'), date, amount, category, description });
    await persistExpenses();
    toast('Expense added');
    renderPL();
  });
  el.querySelectorAll('[data-del-exp]').forEach(btn => {
    btn.addEventListener('click', async () => {
      STATE.expenses = STATE.expenses.filter(x => x.id !== btn.dataset.delExp);
      await persistExpenses();
      toast('Expense removed');
      renderPL();
    });
  });

  if (pl.rows.length){
    makeChart('chartPL', {
      type: 'bar',
      data: {
        labels: pl.rows.map(r => r.label),
        datasets: [
          { label:'Revenue', data: pl.rows.map(r=>r.revenue), backgroundColor: CHART_COLORS.bar1, borderRadius:4 },
          { label:'COGS', data: pl.rows.map(r=>r.cogs), backgroundColor: CHART_COLORS.bar2, borderRadius:4 },
          { label:'Gross profit', data: pl.rows.map(r=>r.profit), backgroundColor: CHART_COLORS.positive, borderRadius:4 },
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{ family:'Inter', size:11 } } } },
        scales:{
          x:{ grid:{ display:false }, ticks:{ font:{ family:'Inter', size:10.5 } } },
          y:{ grid:{ color: CHART_COLORS.gridLine }, ticks:{ font:{ family:'IBM Plex Mono', size:10 }, callback:v=>'\u00A3'+v } }
        }
      }
    });
  }
}

let salesSearchTerm = '';
let salesExpanded = {};

function renderSales(){
  const range = currentRange();
  const ords = filterOrders(STATE.orders, range)
    .filter(o => {
      if (!salesSearchTerm) return true;
      const t = salesSearchTerm.toLowerCase();
      return (o.id||'').toLowerCase().includes(t) || (o.billingName||'').toLowerCase().includes(t) || (o.email||'').toLowerCase().includes(t);
    })
    .sort((a,b) => (getOrderDate(b)||0) - (getOrderDate(a)||0));

  const el = document.getElementById('tab-sales');
  el.innerHTML = `
    <div class="card">
      <div class="card-h"><h3>Import Shopify orders</h3><div class="note">upload your orders export CSV</div></div>
      <div class="import-drop" id="ordersDropZone">
        <div style="font-size:22px; margin-bottom:6px;">&#8593;</div>
        Export orders from Shopify (Orders &rarr; Export) then drop the <span class="mono">.csv</span> file here, or
        <label for="ordersCsvFile" style="color:var(--accent); font-weight:600; cursor:pointer; text-decoration:underline;">browse to choose it</label>.
        Existing orders with the same order number are updated, not duplicated.
        <input type="file" id="ordersCsvFile" accept=".csv,text/csv" style="display:none;">
      </div>
      <div class="btn-row" style="margin-top:6px;">
        <button class="pill-btn ghost small" id="toggleOrdersPaste">Paste CSV text instead</button>
        <button class="pill-btn ghost small" id="exportOrdersBtn">Export current orders (JSON)</button>
      </div>
      <div id="ordersPasteBox" style="display:none; margin-top:10px;">
        <textarea id="ordersCsvInput" rows="5" placeholder="Name,Email,Financial Status,Paid at,...  (paste full CSV here)"></textarea>
        <button class="pill-btn" id="importOrdersBtn" style="margin-top:8px;">Parse &amp; import pasted text</button>
      </div>
    </div>

    <div class="card">
      <div class="card-h">
        <h3>Orders</h3>
        <div class="btn-row">
          <div class="search-box"><span>&#128269;</span><input type="text" id="salesSearch" placeholder="Search order, name, email&hellip;" value="${escapeHtml(salesSearchTerm)}"></div>
          <div class="note">${ords.length} order${ords.length===1?'':'s'}</div>
        </div>
      </div>
      <div class="table-scroll"><table>
        <thead><tr><th></th><th>Order</th><th>Customer</th><th>Date</th><th>Status</th><th class="num">Items</th><th class="num">Shipping</th><th class="num">Total</th></tr></thead>
        <tbody>
        ${ords.length ? ords.map(o => {
          const expanded = !!salesExpanded[o.id];
          return `
          <tr data-order-row="${escapeHtml(o.id)}" style="cursor:pointer;">
            <td>${expanded ? '&#9662;' : '&#9656;'}</td>
            <td class="mono">${escapeHtml(o.id)}${o.cancelledAt ? ' <span class="tag due">cancelled</span>' : ''}</td>
            <td>${escapeHtml(o.billingName||o.shippingName||'\u2014')}<div class="muted" style="font-size:10.5px;">${escapeHtml(o.shippingCity||'')}${o.shippingCountry?', '+escapeHtml(o.shippingCountry):''}</div></td>
            <td class="muted">${fmtDateShort(getOrderDate(o))}</td>
            <td><span class="tag ${o.financialStatus==='paid'?'paid':'grey'}">${escapeHtml(o.financialStatus||'\u2014')}</span></td>
            <td class="num">${(o.lineItems||[]).reduce((s,li)=>s+(li.qty||0),0)}</td>
            <td class="num">${fmtGBP(o.shipping)}</td>
            <td class="num">${fmtGBP(o.total)}</td>
          </tr>
          ${expanded ? `<tr><td></td><td colspan="7" style="background:#FAF9F3;">
            <table style="width:100%;">
              <thead><tr><th>SKU</th><th>Item</th><th class="num">Qty</th><th class="num">Price</th></tr></thead>
              <tbody>${(o.lineItems||[]).map(li => `<tr><td class="mono muted">${escapeHtml(li.sku||'\u2014')}</td><td>${escapeHtml(li.name)}</td><td class="num">${li.qty}</td><td class="num">${fmtGBP(li.price)}</td></tr>`).join('')}</tbody>
            </table>
          </td></tr>` : ''}
          `;
        }).join('') : '<tr><td colspan="8" class="muted" style="text-align:center; padding:24px;">No orders in this range. Import a CSV above to get started.</td></tr>'}
        </tbody>
      </table></div>
    </div>
  `;

  el.querySelectorAll('[data-order-row]').forEach(row => {
    row.addEventListener('click', () => {
      const id = row.dataset.orderRow;
      salesExpanded[id] = !salesExpanded[id];
      renderSales();
    });
  });

  document.getElementById('salesSearch').addEventListener('input', (e) => {
    salesSearchTerm = e.target.value;
    renderSales();
  });

  async function importOrdersCsvText(text, sourceLabel){
    if (!text || !text.trim()){ toast('That CSV looked empty'); return; }
    try{
      const parsed = parseShopifyOrdersCSV(text);
      if (!parsed.length){ toast('No orders found in ' + (sourceLabel||'that file')); return; }
      const { list, added, updated } = mergeOrders(STATE.orders, parsed);
      STATE.orders = list;
      await persistOrders();
      toast(`Imported: ${added} new, ${updated} updated`);
      renderSales();
    }catch(err){
      console.error(err);
      toast('Could not parse that CSV \u2014 check the format');
    }
  }

  document.getElementById('importOrdersBtn').addEventListener('click', () => {
    const text = document.getElementById('ordersCsvInput').value;
    importOrdersCsvText(text).then(() => { document.getElementById('ordersCsvInput').value = ''; });
  });

  document.getElementById('toggleOrdersPaste').addEventListener('click', () => {
    const box = document.getElementById('ordersPasteBox');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  });

  const ordersFileInput = document.getElementById('ordersCsvFile');
  ordersFileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    toast('Reading ' + file.name + '\u2026');
    try{
      const text = await readFileAsText(file);
      await importOrdersCsvText(text, file.name);
    }catch(err){
      console.error(err);
      toast('Could not read that file');
    }
    ordersFileInput.value = '';
  });

  const dropZone = document.getElementById('ordersDropZone');
  ['dragover','dragenter'].forEach(evt => dropZone.addEventListener(evt, (e) => {
    e.preventDefault(); dropZone.style.borderColor = 'var(--accent)'; dropZone.style.background = 'var(--accent-soft)';
  }));
  ['dragleave','drop'].forEach(evt => dropZone.addEventListener(evt, (e) => {
    e.preventDefault(); dropZone.style.borderColor = ''; dropZone.style.background = '';
  }));
  dropZone.addEventListener('drop', async (e) => {
    const file = e.dataTransfer.files[0];
    if (!file) return;
    toast('Reading ' + file.name + '\u2026');
    try{
      const text = await readFileAsText(file);
      await importOrdersCsvText(text, file.name);
    }catch(err){
      console.error(err);
      toast('Could not read that file');
    }
  });

  document.getElementById('exportOrdersBtn').addEventListener('click', () => {
    downloadJSON('tatsatiti-orders.json', STATE.orders);
  });
}

function downloadJSON(filename, data){
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

      await persistInvoices();
      return added + updated;

    if (!files || !files.length) return;
    let totalImported = 0;
    for (let i = 0; i < files.length; i++){
      const file = files[i];
      statusEl.textContent = `Reading ${file.name} (${i+1}/${files.length})\u2026`;
      try{
        const text = await extractPdfText(file);
        const n = await importInvoiceText(text, file.name);
        totalImported += n;
      }catch(err){
        console.error(err);
        toast('Could not read ' + file.name + ' \u2014 try the paste option instead');
      }
    }
    statusEl.textContent = totalImported ? `Imported ${totalImported} document${totalImported===1?'':'s'} from ${files.length} file${files.length===1?'':'s'}.` : 'No invoices found in the uploaded file(s).';
    toast(totalImported ? `Imported ${totalImported} document${totalImported===1?'':'s'}` : 'No invoices found');
    renderPurchases();
  }

  const invoicesFileInput = document.getElementById('invoicesPdfFile');
  invoicesFileInput.addEventListener('change', async (e) => {
    await handlePdfFiles(e.target.files);
    invoicesFileInput.value = '';
  });

  const invDropZone = document.getElementById('invoicesDropZone');
  ['dragover','dragenter'].forEach(evt => invDropZone.addEventListener(evt, (e) => {
    e.preventDefault(); invDropZone.style.borderColor = 'var(--accent)'; invDropZone.style.background = 'var(--accent-soft)';

  ['dragleave','drop'].forEach(evt => invDropZone.addEventListener(evt, (e) => {

  }));
  invDropZone.addEventListener('drop', async (e) => {
    await handlePdfFiles(e.dataTransfer.files);
  });

  document.getElementById('exportInvoicesBtn').addEventListener('click', () => {
    downloadJSON('tatsatiti-invoices.json', STATE.invoices);
  });

  document.getElementById('manualInvoiceBtn').addEventListener('click', () => {
    const f = document.getElementById('manualInvoiceForm');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
  });

  document.getElementById('manualInvoiceSave').addEventListener('click', async () => {
    const docNumber = document.getElementById('manDoc').value.trim();
    const date = document.getElementById('manDate').value;
    if (!docNumber || !date){ toast('Invoice number and date are required'); return; }
    const net = parseFloat(document.getElementById('manNet').value) || 0;
    const vat = parseFloat(document.getElementById('manVat').value) || 0;
    const total = parseFloat(document.getElementById('manTotal').value) || (net+vat);
    const type = document.getElementById('manType').value;
    const dateObj = new Date(date);
    const dateStr = dateObj.getDate() + ' ' + MONTHS_LONG[dateObj.getMonth()] + ' ' + dateObj.getFullYear();
    const record = { docNumber, type, date: dateStr, originalInvoice:null, paymentState:'Paid', weight:null, deliveryCountry:null, totalNet:net, shipping:null, charges:null, vat, total, outsideScopeOfTax:false, lineItems:[] };
    const { list } = mergeInvoices(STATE.invoices, [record]);
    STATE.invoices = list;
    await persistInvoices();
    toast('Invoice saved');
    document.getElementById('manualInvoiceForm').style.display = 'none';
    renderPurchases();
  });
}

}

/* ---------------- Library loading with CDN fallback ----------------
   The primary <script> tags in <head> try cdnjs first (fast path).
   If that's blocked by the network, this retries a couple of
   alternate CDNs before giving up, so charts/CSV/PDF import still work. */
function loadScriptOnce(src, timeoutMs){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    let settled = false;
    const timer = setTimeout(() => {
      if (!settled){ settled = true; reject(new Error('timeout loading ' + src)); }
    }, timeoutMs || 7000);
    s.onload = () => { if (!settled){ settled = true; clearTimeout(timer); resolve(); } };
    s.onerror = () => { if (!settled){ settled = true; clearTimeout(timer); reject(new Error('failed to load ' + src)); } };
    document.head.appendChild(s);
  });
}
async function ensureGlobal(name, urls){
  if (typeof window[name] !== 'undefined') return true;
  for (const url of urls){
    try{
      await loadScriptOnce(url);
      if (typeof window[name] !== 'undefined') return true;
    }catch(e){ /* try next source */ }
  }
  return typeof window[name] !== 'undefined';
}
async function ensureLibraries(){
  const [chartOk, papaOk, pdfInfo] = await Promise.all([
    ensureGlobal('Chart', [
      'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js',
      'https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js',
    ]),
    ensureGlobal('Papa', [
      'https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js',
      'https://unpkg.com/papaparse@5.4.1/papaparse.min.js',
    ]),
    ensurePdfJs(),
  ]);
  return { chart: chartOk, papa: papaOk, pdf: pdfInfo.ok };
}

const PDFJS_SOURCES = [
  { main: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', worker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js' },
  { main: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js', worker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js' },
  { main: 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js', worker: 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js' },
];
let PDFJS_WORKER_SRC = PDFJS_SOURCES[0].worker;
async function ensurePdfJs(){
  // The static <script> tag in <head> already attempted PDFJS_SOURCES[0] (cdnjs).
  if (typeof pdfjsLib !== 'undefined') return { ok: true };
  for (const src of PDFJS_SOURCES.slice(1)){
    try{
      await loadScriptOnce(src.main);
      if (typeof pdfjsLib !== 'undefined'){ PDFJS_WORKER_SRC = src.worker; return { ok: true }; }
    }catch(e){ /* try next */ }
  }
  return { ok: typeof pdfjsLib !== 'undefined' };
}

/* ---------------- Boot / persistence ---------------- */
function showFatalError(context, err){
  console.error('[Ledger error]', context, err);
  const main = document.querySelector('.main');
  const banner = document.createElement('div');
  banner.style.cssText = 'background:#F6E2DF; border:1px solid #B23A2E; color:#7A241B; border-radius:10px; padding:16px 18px; margin-bottom:18px; font-family:IBM Plex Mono, monospace; font-size:12px; white-space:pre-wrap;';
  banner.innerHTML = '<div style="font-family:Inter,sans-serif; font-weight:700; font-size:13.5px; margin-bottom:6px;">Something broke while loading (' + escapeHtml(context) + ')</div>' +
    '<div>' + escapeHtml((err && err.message) || String(err)) + '</div>' +
    '<button id="copyErrBtn" style="margin-top:10px; font-family:Inter,sans-serif; font-size:11.5px; font-weight:600; background:#7A241B; color:#fff; border:none; border-radius:6px; padding:6px 10px; cursor:pointer;">Copy error details</button>';
  main.prepend(banner);
  const btn = banner.querySelector('#copyErrBtn');
  if (btn){
    btn.addEventListener('click', () => {
      const details = context + ': ' + ((err && err.stack) || (err && err.message) || String(err));
      if (navigator.clipboard) navigator.clipboard.writeText(details).catch(()=>{});
      btn.textContent = 'Copied';
    });
  }
}

window.addEventListener('error', (e) => {
  showFatalError('uncaught error', e.error || { message: e.message });
});
window.addEventListener('unhandledrejection', (e) => {
  showFatalError('unhandled promise rejection', e.reason || { message: 'unknown' });
});

async function boot(){
  try{
    const [orders, invoices, expenses, company] = await Promise.all([
      storeGet('orders'), storeGet('invoices'), storeGet('expenses'), storeGet('company')
    ]);

    STATE.orders = Array.isArray(orders) ? orders : (orders === null ? null : []);
    STATE.invoices = Array.isArray(invoices) ? invoices : (invoices === null ? null : []);

    if (STATE.orders === null){
      STATE.orders = SEED_ORDERS;
      await storeSet('orders', STATE.orders);
    }
    if (STATE.invoices === null){
      STATE.invoices = SEED_INVOICES;
      await storeSet('invoices', STATE.invoices);
    }
    STATE.expenses = Array.isArray(expenses) ? expenses : [];
    STATE.company = (company && typeof company === 'object') ? Object.assign({}, DEFAULT_COMPANY, company) : Object.assign({}, DEFAULT_COMPANY);
    STATE.loaded = true;

    renderAll();
  }catch(err){
    showFatalError('startup', err);
    // Fall back to seed data in memory so the UI is at least usable
    try{
      STATE.orders = Array.isArray(STATE.orders) ? STATE.orders : SEED_ORDERS;
      STATE.invoices = Array.isArray(STATE.invoices) ? STATE.invoices : SEED_INVOICES;
      STATE.expenses = Array.isArray(STATE.expenses) ? STATE.expenses : [];
      STATE.company = STATE.company || Object.assign({}, DEFAULT_COMPANY);
      STATE.loaded = true;
      renderAll();
    }catch(err2){
      showFatalError('fallback render', err2);
    }
  }
}

async function persistOrders(){ await storeSet('orders', STATE.orders); }
async function persistInvoices(){ await storeSet('invoices', STATE.invoices); }
async function persistExpenses(){ await storeSet('expenses', STATE.expenses); }
async function persistCompany(){ await storeSet('company', STATE.company); }

const TAB_TITLES = {
  dashboard: ['Dashboard', 'Everything about the business, at a glance.'],
  pl: ['Profit &amp; Loss', 'Revenue, cost of goods, and operating expenses over time.'],
  vat: ['VAT', 'Output tax, input tax, and your registration position.'],
  sales: ['Sales &amp; Orders', 'Customer orders imported from Shopify.'],
  purchases: ['Purchases &amp; Invoices', 'Supplier invoices from Ancient Wisdom / AW Dropship.'],
  customers: ['Customer Intelligence', 'Who buys, how often, and from where.'],
  bi: ['Business Intelligence', 'Product performance and operational trends.'],
  ch: ['Companies House', 'Statutory filing dates for TATSATITI LTD.'],
  settings: ['Company &amp; Data', 'Company details, backups, and data management.'],
};

function setActiveTab(tab){
  STATE.activeTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  const [title, sub] = TAB_TITLES[tab];
  document.getElementById('pageTitle').innerHTML = title;
  document.getElementById('pageSub').innerHTML = sub;
  document.getElementById('globalRangeBar').style.display = (tab === 'ch' || tab === 'settings') ? 'none' : 'flex';
  renderTab(tab);
}

function renderTab(tab){
  if (!STATE.loaded) return;
  const panel = document.getElementById('tab-' + tab);
  try{
    if (tab === 'dashboard') renderDashboard();
    else if (tab === 'pl') renderPL();
    else if (tab === 'vat') renderVAT();
    else if (tab === 'sales') renderSales();
    else if (tab === 'purchases') renderPurchases();
    else if (tab === 'customers') renderCustomers();
    else if (tab === 'bi') renderBI();
    else if (tab === 'ch') renderCH();
    else if (tab === 'settings') renderSettings();
  }catch(err){
    console.error('[Ledger error] render ' + tab, err);
    if (panel){
      panel.innerHTML = '<div class="card" style="border-color:#B23A2E;">' +
        '<div style="font-family:var(--font-display); font-weight:600; color:var(--negative); margin-bottom:6px;">This tab couldn\u2019t render</div>' +
        '<div class="mono" style="font-size:11.5px; color:var(--text-muted); white-space:pre-wrap;">' + escapeHtml((err && err.message) || String(err)) + '</div>' +
        '</div>';
    }
  }
}

function renderAll(){
  renderTab(STATE.activeTab);
}

function wireNav(){
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
  });
  const preset = document.getElementById('rangePreset');
  const from = document.getElementById('rangeFrom');
  const to = document.getElementById('rangeTo');
  const toSep = document.getElementById('rangeToSep');
  preset.addEventListener('change', () => {
    STATE.range.preset = preset.value;
    const custom = preset.value === 'custom';
    from.style.display = custom ? 'block' : 'none';
    toSep.style.display = custom ? 'inline' : 'none';
    to.style.display = custom ? 'block' : 'none';
    renderTab(STATE.activeTab);
  });
  from.addEventListener('change', () => { STATE.range.from = from.value; renderTab(STATE.activeTab); });
  to.addEventListener('change', () => { STATE.range.to = to.value; renderTab(STATE.activeTab); });
}

function currentRange(){ return resolveRange(STATE.range); }

document.addEventListener('DOMContentLoaded', async () => {
  wireNav();
  let libStatus = { chart: true, papa: true, pdf: true };
  try{
    libStatus = await ensureLibraries();
  }catch(e){
    console.error('[Ledger] library loading failed', e);
  }
  if (!libStatus.chart || !libStatus.papa || !libStatus.pdf){
    const main = document.querySelector('.main');
    const missing = [];
    if (!libStatus.chart) missing.push('charts');
    if (!libStatus.papa) missing.push('CSV import');
    if (!libStatus.pdf) missing.push('PDF import');
    const banner = document.createElement('div');
    banner.style.cssText = 'background:#F1E4C4; border:1px solid #A9781F; color:#5C4212; border-radius:10px; padding:12px 16px; margin-bottom:18px; font-size:12.5px;';
    banner.innerHTML = '<strong>Limited mode:</strong> couldn\u2019t load the library for ' + missing.join(' and ') +
      ' from any available source (cdnjs, jsdelivr, unpkg all appear blocked on this network). Every table, KPI, and figure still works \u2014 you may just need a different network or the paste-text import options.';
    main.prepend(banner);
  }
  boot();
});
